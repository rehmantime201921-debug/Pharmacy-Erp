<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>MEGA ERP</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1646;display:flex;align-items:center;justify-content:center;cursor:default;user-select:none}
#st{position:relative;flex:none;width:min(100vw,177.778vh);height:min(100vh,56.25vw);animation:fi .5s ease-out}
#bg{position:fixed;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(28px) brightness(.8);z-index:0}
#st{z-index:1}
#st>img{position:absolute;inset:0;width:100%;height:100%;display:block}
/* animated progress bar drawn exactly over the bar in the picture */
#tr{position:absolute;left:30.16%;width:39.64%;top:74.5%;height:1.02%;border-radius:6px;background:linear-gradient(90deg,#29345c,#283155);box-shadow:0 0 0 1px #0c1a46;overflow:hidden}
#fl{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#29cfff,#6378ff);animation:go 10s linear forwards;position:relative}
#fl:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sh 1.4s linear infinite}
@keyframes go{0%{width:0}25%{width:25%}50%{width:50%}100%{width:100%}}
@keyframes sh{to{left:140%}}
@keyframes fi{from{opacity:0}}
</style></head><body>
<img id="bg" src="splash.png" alt=""><div id="st"><img src="splash.png" alt="MEGA ERP"><div id="tr"><div id="fl"></div></div></div>
</body></html>
